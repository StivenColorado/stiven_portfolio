<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/nunito-900-latin.woff2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stiven Colorado | Desarrollador full stack</title>
    <meta name="description" content="Portafolio de Stiven Colorado: desarrollo web full stack, automatización con IA y sistemas a la medida." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:title" content="Stiven Colorado | Desarrollador full stack" />
    <meta property="og:description" content="Desarrollo web full stack, automatización con IA y sistemas a la medida." />
    <meta property="og:image" content="/pic.jpg" />
    <meta name="twitter:card" content="summary" />
    <!-- Aplica el tema antes del primer paint para evitar flash de color -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (prefersLight ? 'light' : 'dark');
          var root = document.documentElement;
          if (theme === 'dark') root.classList.add('dark');
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Este sitio necesita JavaScript para mostrarse.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
